spring:
  application:
    name: space-cargo-stowage

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cargo}
    username: ${DB_USER:cargo}
    password: ${DB_PASSWORD:cargo}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate        # schema is owned by Flyway, never by Hibernate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8000                    # matches the original PHP backend / Docker EXPOSE

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: Space Cargo Stowage
    version: 1.0.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.spacecargo.stowage: DEBUG
  pattern:
    # Prefix the log level with the request's correlation id (empty for non-request threads)
    level: "%5p [%X{correlationId:-}]"
