services:
  db:
    image: postgres:16-alpine
    container_name: cargo-postgres
    environment:
      POSTGRES_DB: cargo
      POSTGRES_USER: cargo
      POSTGRES_PASSWORD: cargo
    ports:
      - "5432:5432"
    volumes:
      - cargo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargo -d cargo"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: cargo-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/cargo
      DB_USER: cargo
      DB_PASSWORD: cargo
    ports:
      - "8000:8000"

  # Browser-based DB GUI. Opt-in: `docker compose --profile tools up -d pgadmin`
  # Then open http://localhost:5050 (no login) — the "Cargo (local)" server is
  # pre-registered and auto-connects.
  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: cargo-pgadmin
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cargo.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./docker/pgadmin/pgpass:/pgpass:ro
    entrypoint: >
      /bin/sh -c "cp /pgpass /tmp/pgpass && chmod 600 /tmp/pgpass && /entrypoint.sh"

volumes:
  cargo-pgdata:
