services:
  db:
    image: postgres:16-alpine
    container_name: cargo-postgres
    environment:
      POSTGRES_DB: cargo
      POSTGRES_USER: cargo
      POSTGRES_PASSWORD: cargo
    ports:
      - "5432:5432"
    volumes:
      - cargo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargo -d cargo"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: cargo-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/cargo
      DB_USER: cargo
      DB_PASSWORD: cargo
    ports:
      - "8000:8000"

volumes:
  cargo-pgdata:
